# Test-profile overrides.
#
# ClaudeConfig.validate() fails fast when the API key is missing, which is the
# right behaviour for a running service but stops any @SpringBootTest from
# starting a context. This dummy key lets context tests run without a real
# credential; no test in this suite makes a network call.
#
# Note the property name: the record component is apiKey, so Spring binds it
# from claude.api.api-key, not claude.api.key.
claude.api.api-key=test-key-not-a-real-credential
